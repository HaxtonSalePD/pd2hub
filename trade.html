<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Skins | PD2Hub Central</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #16161a;
            --accent-blue: #00a8ff;
            --accent-red: #ff3333;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --nav-bg: #111111;
            --border-color: #2a2a30;
        }
        body.light-theme {
            --bg-dark: #f0f2f5;
            --card-bg: #ffffff;
            --accent-blue: #0077cc;
            --accent-red: #d92626;
            --text-main: #1c1e21;
            --text-muted: #606770;
            --nav-bg: #e4e6eb;
            --border-color: #cccccc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }
        header { background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.95)), radial-gradient(circle, #1a2a3a 0%, #0a0a0c 100%); border-bottom: 3px solid var(--accent-blue); padding: 2.5rem 1rem; text-align: center; }
        header h1 { font-size: 2.5rem; letter-spacing: 4px; color: #fff; text-transform: uppercase; }
        nav { background-color: var(--nav-bg); display: flex; justify-content: space-between; align-items: center; padding: 1rem; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        nav a { color: var(--text-main); text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 4px; }
        nav a:hover, nav a.active { color: var(--accent-blue); background-color: rgba(0, 168, 255, 0.1); }
        .nav-toggle { display: none; background: transparent; border: 2px solid var(--accent-blue); color: var(--text-main); font-size: 1.2rem; padding: 0.2rem 0.6rem; border-radius: 4px; cursor: pointer; }
        .theme-toggle-btn { background: transparent; border: 2px solid var(--accent-blue); color: var(--text-main); padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        @media (max-width: 768px) {
            .nav-toggle { display: block; }
            nav { flex-wrap: wrap; }
            .nav-links { display: none; flex-direction: column; width: 100%; gap: 0.5rem; padding-top: 1rem; }
            .nav-links.active { display: flex; }
            .nav-links a { width: 100%; text-align: center; padding: 0.6rem; }
        }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .section-title { font-size: 1.8rem; text-transform: uppercase; border-left: 4px solid var(--accent-blue); padding-left: 0.75rem; margin-bottom: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 1.5rem; transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-4px); border-color: var(--accent-blue); }
        .btn { display: inline-block; background-color: var(--accent-blue); color: #000; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; padding: 0.6rem 1.2rem; border: none; border-radius: 4px; margin-top: 1rem; cursor: pointer; }
        .toast { position: fixed; bottom: 20px; right: 20px; background-color: var(--card-bg); color: var(--text-main); border: 2px solid var(--accent-blue); padding: 1rem 1.5rem; border-radius: 6px; opacity: 0; visibility: hidden; transform: translateY(20px); transition: all 0.3s ease; z-index: 2000; }
        .toast.show { opacity: 1; visibility: visible; transform: translateY(0); }
    </style>
</head>
<body>

    <header>
        <h1>Trade Hub</h1>
        <p>Community Marketplace & Trading Resources</p>
    </header>

    <nav>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="trade.html">Trading</a>
            <a href="giveaway.html">Giveaway</a>
        </div>
        <div style="display: flex; gap: 0.5rem; align-items: center;" id="navAuthContainer">
            <a href="https://pd2hub-backend.onrender.com/auth/steam" class="steam-login-btn" id="steamAuthBtn">
                <img src="https://community.cloudflare.steamstatic.com/public/images/signinthroughsteam/sits_01.png" alt="Sign in through STEAM" style="vertical-align: middle;">
            </a>
            <button class="theme-toggle-btn" id="themeToggleBtn">☀️ Light Mode</button>
        </div>
    </nav>

    <div class="container">
        <section>
            <h2 class="section-title">Active Trade Offers</h2>
            <div class="grid">
                <div class="card">
                    <h3>AMCAR | Legendary Safe Skin</h3>
                    <p style="color: var(--text-muted);">Mint Condition • Asking 2x Drill Keys</p>
                    <button class="btn" onclick="showToast('Trade offer sent to user!')">Offer Trade</button>
                </div>
                <div class="card">
                    <h3>Judge Shotgun | Gold Weave</h3>
                    <p style="color: var(--text-muted);">Lightly Tested • Open to offers</p>
                    <button class="btn" onclick="showToast('Trade offer sent to user!')">Offer Trade</button>
                </div>
            </div>
        </section>
    </div>

    <div id="toast" class="toast"></div>

    <footer>
        <p>&copy; 2026 PD2Hub Central. Unofficial PAYDAY 2 Community Hub.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
