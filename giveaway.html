<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Giveaways | PD2Hub Central</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --card-bg: #16161a;
            --accent-blue: #00a8ff;
            --accent-red: #ff3333;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --nav-bg: #111111;
            --border-color: #2a2a30;
            --input-bg: #0d0d11;
        }
        body.light-theme {
            --bg-dark: #f0f2f5;
            --card-bg: #ffffff;
            --accent-blue: #0077cc;
            --accent-red: #d92626;
            --text-main: #1c1e21;
            --text-muted: #606770;
            --nav-bg: #e4e6eb;
            --border-color: #cccccc;
            --input-bg: #f8f9fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }
        header { background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.95)), radial-gradient(circle, #1a2a3a 0%, #0a0a0c 100%); border-bottom: 3px solid var(--accent-blue); padding: 2.5rem 1rem; text-align: center; }
        header h1 { font-size: 2.5rem; letter-spacing: 4px; color: #fff; text-transform: uppercase; }
        nav { background-color: var(--nav-bg); display: flex; justify-content: space-between; align-items: center; padding: 1rem; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        nav a { color: var(--text-main); text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 4px; }
        nav a:hover, nav a.active { color: var(--accent-blue); background-color: rgba(0, 168, 255, 0.1); }
        .nav-toggle { display: none; background: transparent; border: 2px solid var(--accent-blue); color: var(--text-main); font-size: 1.2rem; padding: 0.2rem 0.6rem; border-radius: 4px; cursor: pointer; }
        .theme-toggle-btn { background: transparent; border: 2px solid var(--accent-blue); color: var(--text-main); padding: 0.3rem 0.8rem; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        @media (max-width: 768px) {
            .nav-toggle { display: block; }
            nav { flex-wrap: wrap; }
            .nav-links { display: none; flex-direction: column; width: 100%; gap: 0.5rem; padding-top: 1rem; }
            .nav-links.active { display: flex; }
            .nav-links a { width: 100%; text-align: center; padding: 0.6rem; }
        }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .section-title { font-size: 1.8rem; text-transform: uppercase; border-left: 4px solid var(--accent-blue); padding-left: 0.75rem; margin-bottom: 1.5rem; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 2rem; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 0.8rem; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-main); font-size: 1rem; }
        .btn-submit { display: block; width: 100%; background-color: var(--accent-blue); color: #000; font-weight: bold; font-size: 1rem; text-transform: uppercase; padding: 0.8rem; border: none; border-radius: 4px; cursor: pointer; }
        .btn-submit:disabled { background-color: #555; cursor: not-allowed; }
        .toast { position: fixed; bottom: 20px; right: 20px; background-color: var(--card-bg); color: var(--text-main); border: 2px solid var(--accent-blue); padding: 1rem 1.5rem; border-radius: 6px; opacity: 0; visibility: hidden; transform: translateY(20px); transition: all 0.3s ease; z-index: 2000; }
        .toast.show { opacity: 1; visibility: visible; transform: translateY(0); }
    </style>
</head>
<body>

    <header>
        <h1>Loot Safehouse</h1>
        <p>Monthly Weapon Skin & Item Giveaways</p>
    </header>

    <nav>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="trade.html">Trading</a>
            <a href="giveaway.html">Giveaway</a>
        </div>
        <div style="display: flex; gap: 0.5rem; align-items: center;" id="navAuthContainer">
            <a href="https://pd2hub-backend.onrender.com/auth/steam" class="steam-login-btn" id="steamAuthBtn">
                <img src="https://community.cloudflare.steamstatic.com/public/images/signinthroughsteam/sits_01.png" alt="Sign in through STEAM" style="vertical-align: middle;">
            </a>
            <button class="theme-toggle-btn" id="themeToggleBtn">☀️ Light Mode</button>
        </div>
    </nav>

    <div class="container">
        <section class="card">
            <h2 class="section-title">Enter Safehouse Giveaway</h2>
            <div id="authNotice" style="margin-bottom: 1rem; color: var(--accent-red); font-weight: bold;"></div>
            <form id="giveawayForm">
                <div class="form-group">
                    <label for="username">Steam Display Name</label>
                    <input type="text" id="username" placeholder="Sign in with Steam to auto-fill" required readonly>
                </div>
                <div class="form-group">
                    <label for="tradeUrl">Steam Trade URL</label>
                    <input type="url" id="tradeUrl" placeholder="https://steamcommunity.com/tradeoffer/new/..." required>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Submit Entry</button>
            </form>
        </section>
    </div>

    <div id="toast" class="toast"></div>

    <footer>
        <p>&copy; 2026 PD2Hub Central. Unofficial PAYDAY 2 Community Hub.</p>
    </footer>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedUserRaw = localStorage.getItem('steam_user');
            const usernameInput = document.getElementById('username');
            const submitBtn = document.getElementById('submitBtn');
            const authNotice = document.getElementById('authNotice');

            if (savedUserRaw) {
                const savedUser = JSON.parse(savedUserRaw);
                usernameInput.value = savedUser.username;
                authNotice.style.color = 'var(--accent-blue)';
                authNotice.textContent = '✓ Logged in as ' + savedUser.username;
            } else {
                submitBtn.disabled = true;
                authNotice.textContent = '⚠️ Please sign in through Steam at the top navigation bar to enter the giveaway.';
            }

            document.getElementById('giveawayForm').addEventListener('submit', (e) => {
                e.preventDefault();
                showToast('Entry submitted successfully!');
            });
        });
    </script>
</body>
</html>
